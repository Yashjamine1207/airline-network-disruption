# Feature-engineering configuration for:
# Airline Network Disruption Intelligence:
# Delay Prediction, Propagation, Recovery and Network Resilience

version: "0.1.0"

global_rules:
  prediction_timestamp_field: "prediction_timestamp_utc"
  canonical_timezone: "UTC"

  feature_availability_rule: >
    Every predictive feature must be demonstrably available on or before the
    prediction_timestamp_utc of the flight being predicted.

  future_information_allowed: false

  fit_transformers_within_training_fold_only: true
  target_encoding_within_training_fold_only: true
  imputation_within_training_fold_only: true
  scaling_within_training_fold_only: true

  feature_catalog_required: true
  point_in_time_safety_tests_required: true

base_schedule_features:
  enabled: true

  candidate_features:
    - "scheduled_departure_month"
    - "scheduled_departure_day_of_week"
    - "scheduled_departure_day_of_month"
    - "scheduled_departure_hour_local"
    - "scheduled_departure_hour_utc"
    - "scheduled_departure_season"
    - "scheduled_elapsed_time_minutes"
    - "origin_airport"
    - "destination_airport"
    - "route"
    - "carrier_identifier"
    - "flight_number_or_equivalent"

  source_field_names: "to_be_confirmed_after_flight_data_audit"

calendar_features:
  enabled: true

  derive_from:
    - "scheduled_departure_local"
    - "scheduled_departure_utc"

  candidate_features:
    - "month"
    - "quarter"
    - "day_of_week"
    - "day_of_month"
    - "week_of_year"
    - "hour_of_day_local"
    - "hour_of_day_utc"
    - "is_weekend"
    - "season"

historical_features:
  enabled: true

  past_only: true

  candidate_lookback_windows:
    - "7_days"
    - "30_days"
    - "90_days"

  entity_levels:
    - "global"
    - "carrier"
    - "origin_airport"
    - "destination_airport"
    - "route"
    - "origin_airport_hour"
    - "route_hour"

  candidate_measures:
    - "flight_count"
    - "severe_delay_rate"
    - "cancellation_rate"
    - "mean_arrival_delay_minutes"
    - "median_arrival_delay_minutes"
    - "delay_variability"
    - "completed_flight_count"

  rules:
    exclude_current_flight_from_aggregate: true
    use_only_earlier_eligible_records: true
    no_same_day_future_information: true
    missing_history_policy: "use_documented_missing_indicator_or_training_fold_default"

carrier_features:
  enabled: true

  candidate_features:
    - "carrier_historical_severe_delay_rate"
    - "carrier_historical_cancellation_rate"
    - "carrier_historical_mean_arrival_delay"
    - "carrier_historical_median_arrival_delay"
    - "carrier_flight_volume"

  carrier_identifier_policy: "to_be_confirmed_after_source_audit"

airport_features:
  enabled: true

  candidate_features:
    - "origin_historical_severe_delay_rate"
    - "destination_historical_severe_delay_rate"
    - "origin_historical_cancellation_rate"
    - "destination_historical_cancellation_rate"
    - "origin_historical_delay_pressure"
    - "destination_historical_delay_pressure"
    - "origin_historical_flight_volume"
    - "destination_historical_flight_volume"

route_features:
  enabled: true

  candidate_features:
    - "route_historical_severe_delay_rate"
    - "route_historical_cancellation_rate"
    - "route_historical_mean_arrival_delay"
    - "route_historical_median_arrival_delay"
    - "route_historical_flight_volume"

rotation_features:
  enabled: true

  availability_rule: >
    Previous-leg actual outcome features may be used only if the previous
    flight passes all rotation eligibility checks and its actual arrival time
    is on or before the current flight prediction_timestamp_utc.

  candidate_features:
    - "has_eligible_prior_leg"
    - "prior_leg_arrival_delay_minutes"
    - "prior_leg_severe_delay"
    - "prior_leg_cancelled"
    - "prior_leg_actual_arrival_utc"
    - "available_turnaround_minutes"
    - "cumulative_rotation_delay_minutes"
    - "prior_leg_feature_available"

  unavailable_prior_leg_policy: >
    Set outcome-based prior-leg features to missing and create a documented
    availability indicator. Do not substitute future or unavailable outcomes.

weather_features:
  enabled: true

  availability_rule: >
    Use only valid NOAA GHCNh weather observations whose UTC observation time
    is on or before the flight prediction_timestamp_utc.

  candidate_features:
    - "origin_temperature"
    - "destination_temperature"
    - "origin_wind_speed"
    - "destination_wind_speed"
    - "origin_wind_gust_indicator"
    - "destination_wind_gust_indicator"
    - "origin_visibility_indicator"
    - "destination_visibility_indicator"
    - "origin_precipitation_indicator"
    - "destination_precipitation_indicator"
    - "origin_weather_observation_age_minutes"
    - "destination_weather_observation_age_minutes"
    - "origin_weather_match_status"
    - "destination_weather_match_status"

  derived_weather_severity_score:
    allowed: true
    must_be_labelled_project_derived: true
    official_noaa_measure: false

network_features:
  enabled: true

  availability_rule: >
    Each network feature must be calculated from a past-only graph window
    ending on or before the flight prediction_timestamp_utc.

  candidate_features:
    - "origin_out_degree"
    - "origin_weighted_out_degree"
    - "origin_betweenness_centrality"
    - "origin_pagerank"
    - "destination_in_degree"
    - "destination_weighted_in_degree"
    - "destination_betweenness_centrality"
    - "destination_pagerank"
    - "route_historical_weight"
    - "origin_network_disruption_exposure"
    - "destination_network_disruption_exposure"
    - "network_density"

sequence_features:
  enabled: true

  use_cases:
    - "aircraft_rotation_sequences"
    - "documented_operational_time_step_sequences"

  rules:
    past_only_sequences: true
    require_valid_timestamp_ordering: true
    require_rotation_eligibility_for_tail_sequences: true
    do_not_include_future_legs: true

  candidate_sequence_elements:
    - "prior_leg_arrival_delay_minutes"
    - "prior_leg_severe_delay"
    - "prior_leg_cancellation"
    - "turnaround_minutes"
    - "prior_leg_route_features"
    - "prior_leg_weather_features"

prohibited_features:
  - "actual_departure_time_of_predicted_flight"
  - "actual_arrival_time_of_predicted_flight"
  - "actual_departure_delay_of_predicted_flight"
  - "actual_arrival_delay_of_predicted_flight"
  - "actual_elapsed_time_of_predicted_flight"
  - "final_cancellation_reason"
  - "delay_cause_fields"
  - "final_disposition_fields"
  - "future_weather_observations"
  - "future_airport_congestion"
  - "future_route_disruption"
  - "future_carrier_disruption"
  - "future_aircraft_legs"
  - "future_network_features"
  - "full_day_aggregates_with_future_observations"

missing_data:
  add_missingness_indicators_when_appropriate: true
  imputation_fit_on_training_data_only: true
  preserve_weather_match_status: true
  preserve_rotation_feature_availability_status: true
  preserve_timestamp_quality_status: true

ablation_feature_sets:
  - feature_set_id: "base"
    includes:
      - "base_schedule_features"
      - "calendar_features"

  - feature_set_id: "base_plus_historical"
    includes:
      - "base_schedule_features"
      - "calendar_features"
      - "historical_features"
      - "carrier_features"
      - "airport_features"
      - "route_features"

  - feature_set_id: "base_plus_historical_plus_rotation"
    includes:
      - "base_schedule_features"
      - "calendar_features"
      - "historical_features"
      - "carrier_features"
      - "airport_features"
      - "route_features"
      - "rotation_features"

  - feature_set_id: "base_plus_historical_plus_rotation_plus_network"
    includes:
      - "base_schedule_features"
      - "calendar_features"
      - "historical_features"
      - "carrier_features"
      - "airport_features"
      - "route_features"
      - "rotation_features"
      - "network_features"

  - feature_set_id: "full_feature_set"
    includes:
      - "base_schedule_features"
      - "calendar_features"
      - "historical_features"
      - "carrier_features"
      - "airport_features"
      - "route_features"
      - "rotation_features"
      - "network_features"
      - "weather_features"

documentation:
  feature_catalog_file: "docs/data/feature_catalog.md"
  leakage_audit_file: "docs/data/leakage_audit.md"
  output_directory: "data/features"