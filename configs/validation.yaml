# Chronological validation configuration for:
# Airline Network Disruption Intelligence:
# Delay Prediction, Propagation, Recovery and Network Resilience

version: "0.1.0"

primary_validation_design:
  name: "chronological_holdout"
  random_train_test_split_allowed_for_headline_results: false
  final_test_set_locked_until_model_selection_complete: true

proposed_periods:
  status: "provisional_pending_phase_1_source_audit"

  development_training:
    start_year: 2019
    end_year: 2021

  validation:
    start_year: 2022
    end_year: 2022

  final_test:
    start_year: 2023
    end_year: 2023

coverage_rule: >
  All date boundaries must be confirmed from the downloaded flight data before
  modelling begins. If actual coverage differs, update this configuration and
  record the decision in the project decision log.

rolling_origin_backtests:
  enabled: true

  proposed_folds:
    - fold_id: "backtest_01"
      train_start_year: 2019
      train_end_year: 2019
      validation_start_year: 2020
      validation_end_year: 2020

    - fold_id: "backtest_02"
      train_start_year: 2019
      train_end_year: 2020
      validation_start_year: 2021
      validation_end_year: 2021

    - fold_id: "backtest_03"
      train_start_year: 2019
      train_end_year: 2021
      validation_start_year: 2022
      validation_end_year: 2022

  finalisation_rule: >
    Proposed folds are not final until the Phase 1 source-data audit confirms
    actual start dates, end dates, missing periods, and sufficient event counts.

operating_regimes:
  enabled: true

  regimes:
    - regime_id: "pre_covid_reference"
      start_year: 2019
      end_year: 2019
      description: "Pre-COVID reference operating regime"

    - regime_id: "covid_shock"
      start_year: 2020
      end_year: 2020
      description: "COVID-related operational disruption and distribution shift"

    - regime_id: "recovery_transition"
      start_year: 2021
      end_year: 2023
      description: "Recovery and transition operating regime"

  rules:
    do_not_automatically_remove_2020: true
    evaluate_train_with_and_without_2020_when_feasible: true
    report_results_by_regime_when_sample_size_allows: true

fold_safety:
  fit_historical_features_on_training_data_only: true
  fit_imputers_on_training_data_only: true
  fit_encoders_on_training_data_only: true
  fit_scalers_on_training_data_only: true
  fit_feature_selection_on_training_data_only: true
  fit_resampling_on_training_data_only: true
  fit_calibration_on_validation_data_only: true
  optimise_threshold_on_validation_data_only: true
  allow_final_test_data_in_model_selection: false
  allow_final_test_data_in_calibration: false
  allow_final_test_data_in_threshold_selection: false

entity_generalisation:
  enabled_when_data_supports_it: true

  experiments:
    carrier_holdout:
      enabled: true
      purpose: "Assess generalisation to held-out carriers"
      replaces_temporal_validation: false

    airport_holdout:
      enabled: true
      purpose: "Assess generalisation to held-out airports"
      replaces_temporal_validation: false

subgroup_reporting:
  enabled: true

  candidate_subgroups:
    - "operating_regime"
    - "carrier"
    - "origin_airport"
    - "destination_airport"
    - "route"
    - "severe_delay_threshold"
    - "weather_coverage_status"
    - "tail_number_availability"
    - "rotation_eligibility_status"
    - "flight_outcome_status"

experiment_tracking:
  required_fields:
    - "experiment_id"
    - "run_timestamp_utc"
    - "data_version"
    - "raw_data_file_name"
    - "raw_data_hash"
    - "target_version"
    - "feature_version"
    - "prediction_timestamp_policy_version"
    - "split_version"
    - "train_period"
    - "validation_period"
    - "test_period"
    - "model_name"
    - "model_parameters"
    - "random_seed"
    - "class_weighting_or_resampling"
    - "calibration_method"
    - "decision_threshold_or_ranking_capacity"
    - "evaluation_metrics"
    - "notes"

  tracking_method: "reproducible_experiment_table"