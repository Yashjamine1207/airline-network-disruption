# Chronological validation configuration
#
# The boundaries below were confirmed from the audited raw Kaggle CSV:
# - Earliest flight date: 2019-01-01
# - Latest flight date:   2023-08-31
# - Valid FL_DATE rows:   3,000,000 / 3,000,000
#
# This is a retrospective portfolio study. All headline evaluation uses
# chronological splits only. Random train/test splitting is prohibited.

data_coverage:
  flight_date_column: "FL_DATE"
  source_date_format: "%Y-%m-%d"
  audited_start_date: "2019-01-01"
  audited_end_date: "2023-08-31"
  audited_years_present:
    - 2019
    - 2020
    - 2021
    - 2022
    - 2023
  final_year_coverage_note: >
    The dataset contains flights through 2023-08-31 only. The final test
    period is therefore a partial-year test period and must never be
    described as full-year 2023 coverage.

primary_temporal_split:
  # Development/training data. These dates may be used for training and
  # expanding-window development experiments only.
  development_train_start: "2019-01-01"
  development_train_end: "2021-12-31"

  # Used for model selection, hyperparameter tuning, probability calibration,
  # and alert-threshold selection. Do not train final models on this period
  # until all choices are locked.
  validation_start: "2022-01-01"
  validation_end: "2022-12-31"

  # Untouched final evaluation period. It must not affect feature selection,
  # preprocessing, model selection, calibration, or threshold choice.
  final_test_start: "2023-01-01"
  final_test_end: "2023-08-31"
  final_test_is_partial_year: true

operating_regimes:
  pre_covid_reference:
    start_date: "2019-01-01"
    end_date: "2019-12-31"
    label: "2019 pre-COVID reference"

  covid_shock:
    start_date: "2020-01-01"
    end_date: "2020-12-31"
    label: "2020 COVID operational shock"

  recovery_transition:
    start_date: "2021-01-01"
    end_date: "2023-08-31"
    label: "2021-2023 recovery and transition"

rolling_origin_backtests:
  # These backtests are for development analysis. They do not replace the
  # untouched final test period.
  - name: "backtest_train_2019_validate_2020"
    train_start: "2019-01-01"
    train_end: "2019-12-31"
    validation_start: "2020-01-01"
    validation_end: "2020-12-31"

  - name: "backtest_train_2019_2020_validate_2021"
    train_start: "2019-01-01"
    train_end: "2020-12-31"
    validation_start: "2021-01-01"
    validation_end: "2021-12-31"

  - name: "backtest_train_2019_2021_validate_2022"
    train_start: "2019-01-01"
    train_end: "2021-12-31"
    validation_start: "2022-01-01"
    validation_end: "2022-12-31"

rules:
  chronological_splitting_only: true
  random_split_prohibited: true
  final_test_must_remain_untouched: true
  fit_preprocessing_on_training_only: true
  fit_calibration_on_validation_only: true
  choose_threshold_on_validation_only: true
  report_results_by_operating_regime: true
  do_not_drop_2020_as_outlier: true