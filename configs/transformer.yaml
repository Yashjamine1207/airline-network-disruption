# TensorFlow/Keras compact Transformer configuration for:
# Airline Network Disruption Intelligence:
# Delay Prediction, Propagation, Recovery and Network Resilience

version: "0.1.0"

general:
  library: "tensorflow_keras"
  model_family: "compact_transformer"
  random_seed: 42

  status: "final_challenger_model"

  prerequisite: >
    Train and evaluate baseline, statistical, LightGBM, XGBoost, LSTM, and GRU
    models before beginning Transformer experiments.

  chronological_validation_required: true
  final_test_set_used_for_tuning: false

  use_pytorch: false

task:
  primary_task: "severe_arrival_delay_classification"
  secondary_task: "cancellation_classification_if_supported"

  target_configuration_file: "configs/targets.yaml"
  classification_configuration_file: "configs/classification.yaml"

sequence_design:
  primary_sequence_type: "eligible_aircraft_rotation_sequence"

  alternative_sequence_type: "documented_past_operational_time_steps"

  require_past_only_sequence_elements: true
  require_valid_utc_ordering: true
  require_rotation_eligibility_for_tail_sequences: true

  prohibited_sequence_content:
    - "Future aircraft legs"
    - "Future flight outcomes"
    - "Future weather observations"
    - "Future network information"
    - "Actual outcomes from the predicted flight"
    - "Delay-cause fields from the predicted flight"

  sequence_length_candidates:
    - 3
    - 5
    - 10

  final_sequence_length_selection_dataset: "validation_only"

sequence_features:
  candidate_feature_families:
    - "prior_leg_delay_features"
    - "prior_leg_severe_delay_features"
    - "prior_leg_cancellation_features"
    - "turnaround_features"
    - "schedule_features"
    - "historical_features"
    - "weather_features_available_at_prediction_time"
    - "network_features_available_at_prediction_time"

  positional_encoding:
    enabled: true
    type: "learned_or_sinusoidal_to_be_selected_on_validation"

architecture:
  model_dimension_candidates:
    - 32
    - 64
    - 128

  num_attention_heads_candidates:
    - 2
    - 4

  transformer_encoder_blocks_candidates:
    - 1
    - 2

  feed_forward_dimension_candidates:
    - 64
    - 128
    - 256

  dropout_candidates:
    - 0.0
    - 0.2
    - 0.4

  dense_layer_units_candidates:
    - 16
    - 32
    - 64

  output_layer:
    severe_delay: "sigmoid"
    cancellation: "sigmoid"

  compactness_rule: >
    Use a compact architecture appropriate to sequence length and data coverage.
    Do not scale model complexity without measured validation benefit.

training:
  optimiser: "adam"

  learning_rate_candidates:
    - 0.0001
    - 0.0005
    - 0.001

  batch_size_candidates:
    - 128
    - 256
    - 512

  max_epochs: 100

  early_stopping:
    enabled: true
    monitor: "val_pr_auc"
    mode: "max"
    patience: 10
    restore_best_weights: true

  reduce_learning_rate_on_plateau:
    enabled: true
    monitor: "val_pr_auc"
    mode: "max"
    factor: 0.5
    patience: 5
    minimum_learning_rate: 0.00001

class_imbalance:
  enabled: true

  primary_strategy: "class_weight_from_training_fold"

  resampling_enabled_by_default: false
  smote_allowed: false

metrics:
  primary_metric: "pr_auc"

  secondary_metrics:
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "brier_score"
    - "precision_at_k"
    - "recall_at_k"

comparison:
  required_comparators:
    - "majority_class_baseline"
    - "historical_risk_baselines"
    - "logistic_regression"
    - "lightgbm"
    - "xgboost"
    - "lstm"
    - "gru"

  retain_model_only_if: >
    The compact Transformer provides meaningful incremental value in PR-AUC,
    calibration, robustness, ranking quality, or analytical insight that
    justifies its greater complexity and resource use.

calibration:
  enabled: true
  configuration_file: "configs/calibration.yaml"
  calibration_selection_dataset: "validation_only"

explainability:
  attention_weights_as_causal_proof: false

  approved_methods:
    - "temporal_ablation"
    - "sequence_masking"
    - "feature_family_removal"
    - "permutation_importance"

reporting:
  include:
    - "sequence_eligibility_coverage"
    - "tail_identifier_coverage"
    - "sequence_length"
    - "architecture"
    - "parameter_count"
    - "training_time"
    - "training_curves"
    - "validation_metrics"
    - "final_test_metrics_after_selection_is_locked"
    - "calibration_metrics"
    - "error_analysis"
    - "regime_specific_results"
    - "comparison_with_lstm_gru_and_tabular_models"

interpretation_rules:
  - "The Transformer is a compact final challenger, not a required winning model."
  - "Attention weights are not causal explanations."
  - "A simpler model outperforming the Transformer is a valid and strong result."
  - "Sequence-model outputs are retrospective analytical evidence."
  - "Do not present Transformer predictions as real-time airline