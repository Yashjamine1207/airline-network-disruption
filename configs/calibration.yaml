# Phase 7A calibration settings (DEC-023). Read by scripts/run_phase6_calibration.py.
# Changing anything here after results exist is a protocol change: record it in the decision log.
#
# What this file cannot do: it cannot allow the final test. final_test.allowed must stay false and the
# loader refuses to run otherwise. Calibration rows must also come strictly before the rows they are
# scored on; the code enforces that regardless of this file.

version: 1

model:
  # The calibrated model is the tuned LightGBM benchmark refitted with seed 42 (DEC-018, DEC-019).
  feature_set: base_no_year
  params_file: configs/lightgbm_benchmark_selected.json
  seed: 42
  # The refit is checked against the scores already stored for this model. The run stops if the full-year
  # 2022 PR-AUC differs by more than the tolerance, because then a different model would be calibrated.
  reference_predictions: data/processed/phase6/predictions/lightgbm_validation_phase6_tuned_ladder.parquet
  reference_column: lightgbm_base_no_year
  reproduction_pr_auc_tolerance: 0.0005

methods:
  - uncalibrated   # the reference, always kept
  - platt          # logistic on the logit of the score; cannot change the ranking
  - isotonic       # monotone step function; flexible, can create ties

calibration:
  # Experiment A (the one that decides the method): fit on the early-stopping rows, 2021-07-01 to 2021-12-31 UTC.
  # They come after every fit row and before every 2022 row.
  primary_fit_rows: early_stop
  # Experiment B (a diagnostic, never used to choose the method): fit on the first half of 2022,
  # score the second half. It shows whether older calibration rows are a problem.
  diagnostic_fit_rows: validation_first_half

evaluation:
  # 2022 is split at 2022-07-01 UTC by prediction time, exactly as in the LightGBM tuning (DEC-019).
  selection: validation_first_half        # decides which calibrators are candidates
  confirmation: validation_second_half    # confirms the choice with a paired day-level bootstrap
  descriptive: [validation_full_year, validation_by_quarter]

metrics:
  reliability_bins: 10            # equal-count bins
  probability_floor: 1.0e-6       # calibrated probabilities are kept inside [floor, 1 - floor]

bootstrap:
  resamples: 1000
  seed: 42
  confidence: 0.95

decision_rule:
  primary_metric: brier           # lower is better; PR-AUC is reported but cannot be improved by Platt
  simplicity_order: [uncalibrated, platt, isotonic]
  adopt_only_if: whole 95% interval of (Brier(method) - Brier(uncalibrated)) below zero on the confirmation half
  isotonic_over_platt_only_if: whole 95% interval of (Brier(isotonic) - Brier(platt)) below zero on the confirmation half

ranking:
  # Which scores rank flights in the alert-policy step. Platt keeps the order of the raw score.
  # Isotonic turns many scores into ties. The choice is stated next to every ranking result.
  score_used_for_ranking: uncalibrated

final_test:
  allowed: false
