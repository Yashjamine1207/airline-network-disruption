# Probability-calibration configuration for:
# Airline Network Disruption Intelligence:
# Delay Prediction, Propagation, Recovery and Network Resilience

version: "0.1.0"

general:
  enabled: true
  applies_to:
    - "severe_arrival_delay_classification"
    - "cancellation_classification"

  primary_goal: >
    Evaluate whether predicted disruption probabilities correspond to observed
    disruption frequencies in later chronological data.

  final_test_set_used_to_fit_calibration: false
  final_test_set_used_to_select_calibration_method: false

calibration_data:
  model_training_data: "chronological_training_period"
  calibration_selection_data: "chronological_validation_period"
  final_evaluation_data: "untouched_final_temporal_test_period"

  rule: >
    Calibration methods are fitted and selected using validation data only after
    the underlying model is trained on the relevant chronological training
    period.

candidate_methods:
  - method_id: "uncalibrated"
    description: "Use the original model probability without post-processing."

  - method_id: "platt_sigmoid"
    description: >
      Fit a sigmoid probability-calibration model using validation-period
      predictions and outcomes.

  - method_id: "isotonic"
    description: >
      Fit an isotonic probability-calibration model using validation-period
      predictions and outcomes when validation sample size supports it.

selection:
  primary_selection_metric: "brier_score"

  supporting_evidence:
    - "reliability_curve"
    - "calibration_curve"
    - "pr_auc"
    - "precision_at_k"
    - "recall_at_k"
    - "regime_specific_calibration"

  selection_rule: >
    Select a calibration method only when it improves or preserves useful
    ranking performance while improving probability reliability on validation
    data. Retain the uncalibrated model when calibration does not provide
    meaningful benefit.

evaluation:
  required_metrics:
    - "brier_score"
    - "reliability_diagram"
    - "calibration_curve"
    - "predicted_probability_distribution"
    - "observed_event_rate_by_probability_bin"

  probability_bins:
    strategy: "quantile_or_fixed_bins_to_be_documented"
    minimum_bin_sample_rule: "to_be_defined_after_event_prevalence_audit"

  subgroup_evaluation:
    enabled_when_sample_size_allows: true

    candidate_subgroups:
      - "operating_regime"
      - "carrier"
      - "origin_airport"
      - "destination_airport"
      - "route"
      - "weather_coverage_status"
      - "rotation_eligibility_status"

ranking_policy:
  preserve_probability_ranking_evaluation: true

  ranked_review_capacities:
    - 0.005
    - 0.01
    - 0.05
    - 0.10

  report:
    - "precision_at_k"
    - "recall_at_k"
    - "events_captured_at_k"
    - "false_alerts_at_k"

reporting:
  compare_uncalibrated_and_calibrated_models: true

  required_outputs:
    - "brier_score_comparison"
    - "reliability_curve_comparison"
    - "calibration_curve_comparison"
    - "pr_auc_comparison"
    - "ranked_alert_metric_comparison"
    - "calibration_by_operating_regime"
    - "calibration_limitations"

documentation:
  metric_definitions_file: "docs/decisions/metric_definitions.md"
  validation_strategy_file: "docs/decisions/validation_strategy.md"
  alert_policy_file: "docs/decisions/alert_threshold_policy.md"
  calibration_report: "reports/evaluation/calibration_and_alert_policy_report.md"

interpretation_rules:
  - "Calibration evaluates the reliability of predicted probabilities."
  - "A calibrated probability is not an operational guarantee."
  - "Calibration does not make the project a real-time airline decision system."
  - "Calibration method selection must not use final-test outcomes."