[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-network-disruption-intelligence"
version = "0.1.0"
description = "A retrospective aviation Data Science study of delay prediction, disruption propagation, recovery, and network resilience."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Yash Jamine" }
]
keywords = [
  "aviation",
  "airline",
  "flight-delay",
  "cancellation",
  "machine-learning",
  "time-series",
  "network-science",
  "survival-analysis",
  "tensorflow"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "pandas>=2.2,<3.0",
  "polars>=1.0,<2.0",
  "pyarrow>=16.0,<20.0",
  "duckdb>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "lightgbm>=4.0,<5.0",
  "xgboost>=2.0,<4.0",
  "tensorflow>=2.16,<3.0",
  "networkx>=3.3,<4.0",
  "lifelines>=0.29,<1.0",
  "shap>=0.46,<1.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "plotly>=5.20,<7.0",
  "jupyterlab>=4.0,<5.0",
  "ipykernel>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
  "python-dotenv>=1.0,<2.0",
  "joblib>=1.4,<2.0",
  "tzdata>=2025.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "black>=24.0,<26.0",
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<5.0",
  "types-PyYAML>=6.0,<7.0",
  "pandas-stubs>=2.2,<3.0"
]

experiment_tracking = [
  "mlflow>=2.15,<4.0"
]

dashboard = [
  "streamlit>=1.38,<2.0"
]

[project.urls]
Repository = "https://github.com/your-github-username/airline-network-disruption-intelligence"
Documentation = "https://github.com/your-github-username/airline-network-disruption-intelligence"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
markers = [
  "slow: marks tests that are computationally expensive",
  "integration: marks tests that require multiple project components"
]

[tool.coverage.run]
branch = true
source = ["airline_disruption"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:"
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "data",
  "models/artifacts",
  "models/checkpoints",
  "mlruns"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM"
]
ignore = [
  "E501"
]

[tool.ruff.lint.isort]
known-first-party = ["airline_disruption"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = """
/(
    data
  | models/artifacts
  | models/checkpoints
  | mlruns
)/
"""

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["airline_disruption"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
  "data/",
  "models/artifacts/",
  "models/checkpoints/",
  "mlruns/"
]
